<!doctype html>
<html lang="it">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CineMania</title>
</head>

<body>
  <header class="site-header">
    <a href="#" class="logo-link" style="text-decoration: none;">
      <svg width="240" height="42" viewBox="0 0 240 42" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="cm-gradient-c" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#FFFFFF" />
            <stop offset="65%" stop-color="#4FC3F7" />
            <stop offset="100%" stop-color="#2F8FD1" />
          </linearGradient>
        </defs>

        <!-- Icona Fotogramma + Play -->
        <rect x="5" y="6" width="30" height="30" rx="8" stroke="url(#cm-gradient-c)" stroke-width="2.5"
          fill="rgba(79, 195, 247, 0.05)" />
        <!-- Dettagli fori pellicola sopra/sotto -->
        <rect x="9" y="9" width="3" height="3" rx="1" fill="url(#cm-gradient-c)" />
        <rect x="28" y="9" width="3" height="3" rx="1" fill="url(#cm-gradient-c)" />
        <rect x="9" y="30" width="3" height="3" rx="1" fill="url(#cm-gradient-c)" />
        <rect x="28" y="30" width="3" height="3" rx="1" fill="url(#cm-gradient-c)" />
        <!-- Tasto Play al centro -->
        <polygon points="17,15 27,21 17,27" fill="url(#cm-gradient-c)" />

        <!-- Testo Sfumato -->
        <text x="48" y="28" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="24"
          fill="url(#cm-gradient-c)" letter-spacing="0.02em">
          CineMania
        </text>
      </svg>
    </a>
    <nav class="site-nav">
      <!-- Aggiunto id="nav-page-title" qui sotto -->
      <h2 id="nav-page-title" class="active">HOME</h2>
    </nav>
  </header>

  <main id="app">
    <!-- qui TypeScript inietterà la lista dei film -->
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 CineMania - Progetto ITS</p>
  </footer>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
